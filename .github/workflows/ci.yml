name: CI

# Runs on every push and pull request. Tests use the small real-data fixture in
# tests/fixtures/, never the full 245 MB FDA download.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drugs
          POSTGRES_PASSWORD: drugs
          POSTGRES_DB: drugs_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U drugs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://drugs:drugs@localhost:5433/drugs_test
      TEST_DATABASE_URL: postgresql+psycopg://drugs:drugs@localhost:5433/drugs_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy app tests scripts

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
